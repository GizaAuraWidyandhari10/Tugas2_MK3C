<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <header class="header">
            <h1>Form Login</h1>
        </header>

        <main>
            <img src="asset/logo.jpg" alt="Logo" class="logo">
            <h2>NIS</h2>
            <input type="number" placeholder="Enter your NIS" required>

            <h3>Password</h3>
            <input type="password" placeholder="Password" required>
            <label>
                <input type="checkbox" class="show-password"> Show Password
            </label>
            <br><br>
            <button class="submit">Login</button>
            <img src="asset/login_success.png" alt="Login Success" class="login-success">
        </main>
    </div>

    <script src="script.js"></script>

</body>

</html>
